[package]
name = "dpi-peek"
version = "0.1.0"
edition = "2021"
description = "HP Professor 1 DPI display for Windows"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dpi-peek"
path = "src/bin/dpi-peek.rs"

[[bin]]
name = "dpi-status"
path = "src/bin/dpi-status.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
